<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle JoFit Booking Calendar</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span.icon { font-size: 1.6rem; }

    /* ── Config Bar ───────────────────────────────────────────── */
    .config-bar {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .config-bar label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .8rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .config-bar input, .config-bar select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: .95rem;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: border-color .2s;
    }

    .config-bar input:focus, .config-bar select:focus {
      border-color: #6366f1;
      background: #fff;
    }

    .config-bar button {
      padding: 9px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-bar button:hover  { background: #4f46e5; }
    .config-bar button:active { transform: scale(.97); }

    /* ── Summary Cards ────────────────────────────────────────── */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      border-left: 4px solid transparent;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card .card-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
    .card .card-value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .card.total   { border-color: #6366f1; } .card.total   .card-value { color: #6366f1; }
    .card.pending { border-color: #f59e0b; } .card.pending .card-value { color: #f59e0b; }
    .card.cleared { border-color: #22c55e; } .card.cleared .card-value { color: #22c55e; }
    .card.entered { border-color: #3b82f6; } .card.entered .card-value { color: #3b82f6; }
    .card.canceled{ border-color: #ef4444; } .card.canceled .card-value{ color: #ef4444; }

    /* ── Calendar Nav ─────────────────────────────────────────── */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-nav h2 { font-size: 1.2rem; font-weight: 700; }

    .cal-nav-btn {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      transition: background .15s;
    }

    .cal-nav-btn:hover { background: #f1f5f9; }

    /* ── Calendar Grid ────────────────────────────────────────── */
    .calendar-grid {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #6366f1;
    }

    .grid-header span {
      padding: 10px 0;
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .grid-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 100px;
      border-right: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      padding: 8px;
      position: relative;
      cursor: default;
      transition: background .15s;
    }

    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell.empty { background: #f8fafc; }
    .day-cell.today { background: #eef2ff; }
    .day-cell.has-bookings { cursor: pointer; }
    .day-cell.has-bookings:hover { background: #f5f3ff; }

    .day-number {
      font-size: .85rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .day-cell.today .day-number {
      background: #6366f1;
      color: #fff;
    }

    .day-cell.empty .day-number { color: #cbd5e1; }

    /* status dots row */
    .dots-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 2px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* compact count badges */
    .count-badges {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
    }

    .badge {
      font-size: .68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .badge.pending  { background: #fef3c7; color: #92400e; }
    .badge.cleared  { background: #dcfce7; color: #166534; }
    .badge.entered  { background: #dbeafe; color: #1e40af; }
    .badge.canceled { background: #fee2e2; color: #991b1b; }

    /* ── Modal ────────────────────────────────────────────────── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 540px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      animation: slideUp .2s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 { font-size: 1.05rem; font-weight: 700; }
    .modal-header .date-sub { font-size: .8rem; color: #64748b; margin-top: 2px; }

    .modal-close {
      background: #f1f5f9;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      transition: background .15s;
    }

    .modal-close:hover { background: #e2e8f0; }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    /* event item */
    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .event-item:last-child { border-bottom: none; }

    .event-color-bar {
      width: 4px;
      min-height: 52px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .event-info { flex: 1; }

    .event-title {
      font-weight: 600;
      font-size: .95rem;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .event-meta {
      font-size: .8rem;
      color: #64748b;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .event-meta span { display: flex; align-items: center; gap: 4px; }

    .event-status {
      font-size: .72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 5px;
      width: fit-content;
    }

    /* ── Legend ───────────────────────────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .8rem;
      color: #475569;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* ── Loading & Error ──────────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .state-box .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .state-box p { font-size: .95rem; }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 600px) {
      .day-cell { min-height: 64px; padding: 4px; }
      .count-badges { display: none; }
      .dot { width: 6px; height: 6px; }
      .day-number { font-size: .75rem; width: 22px; height: 22px; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <!-- Header -->
  <header>
    <h1><span class="icon">🗓️</span> Vehicle JoFit Booking Calendar</h1>
  </header>

  <!-- Config Bar -->
  <div class="config-bar">
    <label>
      API Base URL
      <input id="apiBase" type="text" value="https://localhost:7000/api/v1" style="width:240px;" />
    </label>
    <label>
      Token (Bearer)
      <input id="apiToken" type="text" placeholder="Paste JWT token…" style="width:220px;" />
    </label>
    <button onclick="loadCalendar()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
      Load
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards" id="summaryCards" style="display:none">
    <div class="card total">
      <span class="card-label">Total Bookings</span>
      <span class="card-value" id="cTotal">0</span>
    </div>
    <div class="card pending">
      <span class="card-label">Pending</span>
      <span class="card-value" id="cPending">0</span>
    </div>
    <div class="card cleared">
      <span class="card-label">Cleared</span>
      <span class="card-value" id="cCleared">0</span>
    </div>
    <div class="card entered">
      <span class="card-label">Entered</span>
      <span class="card-value" id="cEntered">0</span>
    </div>
    <div class="card canceled">
      <span class="card-label">Canceled</span>
      <span class="card-value" id="cCanceled">0</span>
    </div>
  </div>

  <!-- Calendar Navigation -->
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="navigate(-1)">&#8592; Prev</button>
    <h2 id="calTitle">—</h2>
    <button class="cal-nav-btn" onclick="navigate(1)">Next &#8594;</button>
  </div>

  <!-- Calendar -->
  <div class="calendar-grid">
    <div class="grid-header" id="gridHeader"></div>
    <div class="grid-body"   id="gridBody">
      <div class="state-box" style="grid-column:1/-1">
        <div class="icon">📅</div>
        <p>Configure the API base URL and token, then click <strong>Load</strong>.</p>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend" style="margin-top:16px;">
    <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> Pending</div>
    <div class="legend-item"><span class="legend-dot" style="background:#22c55e"></span> Cleared</div>
    <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> JoFit Entered</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> Canceled</div>
  </div>

</div>

<!-- Day Detail Modal -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h3 id="modalTitle">Bookings</h3>
        <div class="date-sub" id="modalDate"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;   // 1-based
let calendarData = null;                         // last API response

const DAY_NAMES  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

// ── Fetch ──────────────────────────────────────────────────────────────
async function loadCalendar() {
  const base  = document.getElementById('apiBase').value.replace(/\/$/, '');
  const token = document.getElementById('apiToken').value.trim();

  document.getElementById('calTitle').textContent =
    `${MONTH_NAMES[currentMonth - 1]} ${currentYear}`;

  showLoading();

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const url = `${base}/BookVehicleJoFit/calendar?year=${currentYear}&month=${currentMonth}`;
    const res = await fetch(url, { headers });

    if (!res.ok) {
      const txt = await res.text();
      showError(`HTTP ${res.status}: ${txt}`);
      return;
    }

    calendarData = await res.json();
    renderCalendar(calendarData);
    renderSummary(calendarData);

  } catch (err) {
    showError(err.message);
  }
}

// ── Navigation ─────────────────────────────────────────────────────────
function navigate(dir) {
  currentMonth += dir;
  if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  loadCalendar();
}

// ── Summary Cards ──────────────────────────────────────────────────────
function renderSummary(data) {
  let pending = 0, cleared = 0, entered = 0, canceled = 0;

  (data.days || []).forEach(d => {
    pending  += d.pendingCount  || 0;
    cleared  += d.clearedCount  || 0;
    entered  += d.enteredCount  || 0;
    canceled += d.canceledCount || 0;
  });

  document.getElementById('cTotal').textContent   = data.totalBookings || 0;
  document.getElementById('cPending').textContent  = pending;
  document.getElementById('cCleared').textContent  = cleared;
  document.getElementById('cEntered').textContent  = entered;
  document.getElementById('cCanceled').textContent = canceled;

  document.getElementById('summaryCards').style.display = 'grid';
}

// ── Calendar Render ────────────────────────────────────────────────────
function renderCalendar(data) {
  // Index API days by date string YYYY-MM-DD
  const dayMap = {};
  (data.days || []).forEach(d => {
    const key = isoDate(d.date);
    dayMap[key] = d;
  });

  // Build header
  const header = document.getElementById('gridHeader');
  header.innerHTML = DAY_NAMES.map(n => `<span>${n}</span>`).join('');

  // First day of month weekday (0=Sun)
  const firstWeekday = new Date(currentYear, currentMonth - 1, 1).getDay();
  const daysInMonth  = new Date(currentYear, currentMonth, 0).getDate();
  const todayStr     = isoDate(new Date().toISOString());

  const body = document.getElementById('gridBody');
  body.innerHTML = '';

  // Leading empty cells
  for (let i = 0; i < firstWeekday; i++) {
    body.appendChild(emptyCell());
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${pad(currentMonth)}-${pad(d)}`;
    const dayData = dayMap[dateStr] || null;
    body.appendChild(buildDayCell(d, dateStr, dayData, dateStr === todayStr));
  }

  // Trailing empty cells to fill the last row
  const total = firstWeekday + daysInMonth;
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 0; i < trailing; i++) {
    body.appendChild(emptyCell());
  }
}

function emptyCell() {
  const cell = document.createElement('div');
  cell.className = 'day-cell empty';
  return cell;
}

function buildDayCell(dayNum, dateStr, dayData, isToday) {
  const cell = document.createElement('div');
  cell.className = 'day-cell' + (isToday ? ' today' : '') + (dayData ? ' has-bookings' : '');

  // Day number
  const num = document.createElement('div');
  num.className = 'day-number';
  num.textContent = dayNum;
  cell.appendChild(num);

  if (dayData && dayData.totalBookings > 0) {
    // Dots
    const dots = document.createElement('div');
    dots.className = 'dots-row';

    const addDots = (count, color) => {
      for (let i = 0; i < Math.min(count, 5); i++) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = color;
        dots.appendChild(dot);
      }
    };

    addDots(dayData.pendingCount,  '#f59e0b');
    addDots(dayData.clearedCount,  '#22c55e');
    addDots(dayData.enteredCount,  '#3b82f6');
    addDots(dayData.canceledCount, '#ef4444');
    cell.appendChild(dots);

    // Count badges
    const badges = document.createElement('div');
    badges.className = 'count-badges';

    const addBadge = (count, cls, label) => {
      if (!count) return;
      const b = document.createElement('span');
      b.className = `badge ${cls}`;
      b.textContent = `${count} ${label}`;
      badges.appendChild(b);
    };

    addBadge(dayData.pendingCount,  'pending',  'Pending');
    addBadge(dayData.clearedCount,  'cleared',  'Cleared');
    addBadge(dayData.enteredCount,  'entered',  'Entered');
    addBadge(dayData.canceledCount, 'canceled', 'Canceled');
    cell.appendChild(badges);

    // Click → modal
    cell.addEventListener('click', () => openModal(dayData, dateStr));
  }

  return cell;
}

// ── Modal ──────────────────────────────────────────────────────────────
function openModal(dayData, dateStr) {
  const date = new Date(dateStr + 'T00:00:00');
  document.getElementById('modalTitle').textContent =
    `${dayData.totalBookings} Booking${dayData.totalBookings !== 1 ? 's' : ''}`;
  document.getElementById('modalDate').textContent =
    date.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  if (!dayData.events || dayData.events.length === 0) {
    body.innerHTML = '<p style="color:#64748b;text-align:center;padding:24px 0">No events found.</p>';
  } else {
    dayData.events.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'event-item';

      const bar = document.createElement('div');
      bar.className = 'event-color-bar';
      bar.style.background = ev.color || '#94a3b8';

      const info = document.createElement('div');
      info.className = 'event-info';

      const time = ev.start ? new Date(ev.start).toLocaleTimeString('en-US',
        { hour: '2-digit', minute: '2-digit', hour12: true }) : '';

      const { label, bg, fg } = statusLabel(ev);

      info.innerHTML = `
        <div class="event-title">${esc(ev.title)}</div>
        <div class="event-meta">
          ${time ? `<span>🕐 ${time}</span>` : ''}
          ${ev.phoneNumber ? `<span>📞 ${esc(ev.phoneNumber)}</span>` : ''}
          ${ev.plateNumber ? `<span>🚗 ${esc(ev.plateNumber)}</span>` : ''}
        </div>
        <span class="event-status" style="background:${bg};color:${fg}">${label}</span>
      `;

      item.appendChild(bar);
      item.appendChild(info);
      body.appendChild(item);
    });
  }

  document.getElementById('modal').classList.add('open');
}

function statusLabel(ev) {
  if (ev.isCanceled)         return { label: '🚫 Canceled',           bg: '#fee2e2', fg: '#991b1b' };
  if (ev.isJoFitEntered) return { label: '✅ JoFit Entered',  bg: '#dbeafe', fg: '#1e40af' };
  if (ev.isCleared)           return { label: '✔ Cleared',            bg: '#dcfce7', fg: '#166534' };
  return                             { label: '⏳ Pending',             bg: '#fef3c7', fg: '#92400e' };
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}

// ── Helpers ────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('gridBody').innerHTML = `
    <div class="state-box" style="grid-column:1/-1">
      <div class="spinner"></div>
      <p>Loading bookings…</p>
    </div>`;
}

function showError(msg) {
  document.getElementById('gridBody').innerHTML = `
    <div class="state-box" style="grid-column:1/-1">
      <div class="icon">⚠️</div>
      <p style="color:#ef4444">${esc(msg)}</p>
    </div>`;
}

function isoDate(value) {
  // Accepts ISO string or Date — returns YYYY-MM-DD
  return (typeof value === 'string' ? value : value.toISOString()).slice(0, 10);
}

function pad(n) { return String(n).padStart(2, '0'); }

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────
document.getElementById('calTitle').textContent =
  `${MONTH_NAMES[currentMonth - 1]} ${currentYear}`;

// keyboard: Esc closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});
